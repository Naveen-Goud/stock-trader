apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  namespace: stock-sim
spec:
  replicas: 1
  selector: { matchLabels: { app: service-discovery } }
  template:
    metadata: { labels: { app: service-discovery } }
    spec:
      containers:
        - name: service-discovery
          image: stock-sim/service-discovery:1.0.0
          ports: [{ containerPort: 8761 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "300m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: service-discovery
  namespace: stock-sim
spec:
  selector: { app: service-discovery }
  ports: [{ port: 8761, targetPort: 8761 }]

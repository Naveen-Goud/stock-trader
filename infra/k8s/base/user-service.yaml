apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: stock-sim
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
        - name: user-service
          image: stock-sim/user-service:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: stock-sim-config }
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/user_db"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: stock-sim-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: stock-sim-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "500m",  memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: stock-sim
spec:
  selector: { app: user-service }
  ports: [{ port: 8080, targetPort: 8080 }]

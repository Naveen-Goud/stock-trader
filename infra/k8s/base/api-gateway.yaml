apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: stock-sim
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: stock-sim/api-gateway:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: stock-sim-config }
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: stock-sim-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "500m",  memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: stock-sim
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock-sim-ingress
  namespace: stock-sim
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: stocksim.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8080 } }
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }

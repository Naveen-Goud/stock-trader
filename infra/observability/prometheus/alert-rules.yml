groups:
  - name: trading-critical
    rules:
      - alert: TradeErrorRateHigh
        expr: |
          100 * sum(rate(http_server_requests_seconds_count{uri=~"/api/trading/(buy|sell)",outcome="SERVER_ERROR"}[5m]))
          / sum(rate(http_server_requests_seconds_count{uri=~"/api/trading/(buy|sell)"}[5m])) > 1
        for: 3m
        labels: { severity: critical, team: trading }
        annotations:
          summary: "Trade error rate exceeds 1% for 3+ minutes"

      - alert: OutboxRelayBacklog
        expr: outbox_pending_events_total > 500
        for: 5m
        labels: { severity: critical, team: trading }
        annotations:
          summary: "Outbox relay has 500+ unpublished events"

      - alert: KafkaConsumerLagHigh
        expr: kafka_consumergroup_lag > 10000
        for: 5m
        labels: { severity: warning, team: platform }

      - alert: DeadLetterMessagesDetected
        expr: increase(kafka_topic_partition_current_offset{topic=~".*\\.DLT"}[10m]) > 0
        for: 0m
        labels: { severity: warning, team: platform }

  - name: infrastructure
    rules:
      - alert: PostgresConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 2m
        labels: { severity: warning, team: platform }

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels: { severity: warning, team: platform }

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: user_db,trading_db,portfolio_db,marketdata_db,notification_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 12
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports: ["8090:8080"]

  service-discovery:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.backend
      args: { SERVICE_NAME: service-discovery }
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 10

  api-gateway:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.backend
      args: { SERVICE_NAME: api-gateway }
    depends_on: [service-discovery]
    environment:
      EUREKA_URI: http://service-discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-in-prod-min-32-chars}
    ports: ["8080:8080"]

  user-service:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.backend
      args: { SERVICE_NAME: user-service }
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    environment:
      SERVER_PORT: 8080
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-in-prod-min-32-chars}

  trading-service:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.backend
      args: { SERVICE_NAME: trading-service }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trading_db
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-in-prod-min-32-chars}

  portfolio-service:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.backend
      args: { SERVICE_NAME: portfolio-service }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_db
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-in-prod-min-32-chars}

  market-data-service:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.backend
      args: { SERVICE_NAME: market-data-service }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketdata_db
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-in-prod-min-32-chars}

  notification-service:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.backend
      args: { SERVICE_NAME: notification-service }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-in-prod-min-32-chars}

  frontend:
    build:
      context: ../frontend/stock-trading-ui
      dockerfile: ../../infra/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_WS_BASE_URL: http://localhost:8080
    depends_on: [api-gateway]
    ports: ["3000:80"]

  prometheus:
    image: prom/prometheus:v2.54.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports: ["3001:3000"]

volumes:
  pg_data:
  grafana_data:
